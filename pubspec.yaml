name: suppersync
description: "Community dining through shared food inventories, collaborative meal planning, and zero-waste cooking."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── Supabase ───────────────────────────────────────────────────────────────
  supabase_flutter: ^2.5.0

  # ─── State Management ───────────────────────────────────────────────────────
  provider: ^6.1.2

  # ─── Navigation ─────────────────────────────────────────────────────────────
  go_router: ^13.2.0

  # ─── UI & Design ────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # ─── Local Storage ──────────────────────────────────────────────────────────
  shared_preferences: ^2.2.3

  # ─── Image Handling ─────────────────────────────────────────────────────────
  image_picker: ^1.1.2

  # ─── Utilities ──────────────────────────────────────────────────────────────
  http: ^1.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  flutter_dotenv: ^5.1.0

  # ─── Icons ──────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/images/
    - assets/icons/
    - assets/lottie/
